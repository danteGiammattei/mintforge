name = "mintforge"
compatibility_date = "2025-04-01"
pages_build_output_dir = "dist"

# Smart Placement: run the functions next to the D1 database rather than
# next to each player. A request makes several trips to the database and
# the player only one to the function, so the trips that repeat are the
# ones made short. (Cloudflare takes ~15 minutes after a deploy to place it.)
[placement]
mode = "smart"

[[d1_databases]]
binding = "DB"
database_name = "mintforge"
# database_id will be filled in by wrangler when you run:
#   npx wrangler d1 create mintforge
# OR set it in the Cloudflare dashboard after creating the D1 database.
database_id = "fb56dbbd-68e1-4ec1-83c4-eb475918f718"
